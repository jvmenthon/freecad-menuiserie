name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, typage et tests unitaires
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer l'outillage
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy freecad tests
      - name: Code dupliqué (pylint)
        run: pylint freecad tests tools
      - name: Tests unitaires
        run: pytest tests/unit --cov --cov-report=term-missing

  integration:
    name: Intégration FreeCAD ${{ matrix.freecad }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        freecad: ["1.1"]  # version minimale prise en charge (ADR 0023)
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: freecad
          create-args: >-
            freecad=${{ matrix.freecad }}.*
            pytest
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
      - name: Version de FreeCAD
        run: |
          export PYTHONPATH="$CONDA_PREFIX/lib:$PYTHONPATH"
          python -c "import FreeCAD; print(FreeCAD.Version())"
      - name: Tests d'intégration
        # Dossier utilisateur temporaire : la fixture de tests/integration/conftest.py modifie
        # UserLibraryPath dans user.cfg, qui ne doit pas être celui du runner.
        run: |
          export PYTHONPATH="$CONDA_PREFIX/lib:$PYTHONPATH"
          export FREECAD_USER_HOME="$RUNNER_TEMP/freecad-home-tests"
          mkdir -p "$FREECAD_USER_HOME"
          pytest tests/integration -m integration
      - name: Chargement dans l'interface de FreeCAD
        env:
          QT_QPA_PLATFORM: offscreen
        # Pas de « exit » explicite : dans ce shell de connexion (bash -l), il exécute
        # ~/.bash_logout, dont le code de retour remplace celui du script.
        run: |
          export FREECAD_USER_HOME="$RUNNER_TEMP/freecad-home"
          mkdir -p "$FREECAD_USER_HOME/Mod"
          ln -s "$GITHUB_WORKSPACE" "$FREECAD_USER_HOME/Mod/Menuiserie"
          # Zone de notifications coupée : sa bulle bloque FreeCAD hors écran.
          freecadcmd "$GITHUB_WORKSPACE/tests/gui/couper_notifications.py"
          export RESULTAT="$RUNNER_TEMP/resultat-gui.txt"
          journal="$RUNNER_TEMP/freecad-gui.log"
          statut=0
          timeout 300 freecad "$GITHUB_WORKSPACE/tests/gui/verifier_atelier.py" > "$journal" 2>&1 \
            || statut=$?
          if [ "$statut" -eq 0 ] && grep -q '^OK' "$RESULTAT" 2>/dev/null; then
            cat "$RESULTAT"
          else
            # Rapport et fin du journal en annotations, lisibles depuis la PR.
            echo "::error title=Interface FreeCAD::echec du chargement (statut $statut)"
            if [ -f "$RESULTAT" ]; then
              sed 's/^/::error title=Rapport::/' "$RESULTAT"
            fi
            tail -n 90 "$journal" | sed 's/^/::warning title=Journal FreeCAD::/'
            false
          fi
      - name: Serveur X virtuel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Scénarios QTest dans FreeCAD
        # Chaque module tests/qtest/scenario_*.py dans un vrai FreeCAD, sur un vrai serveur X :
        # claviers et clics de QTest sur les panneaux. Lancés par tests/qtest/lanceur.py (rapport
        # dans un fichier, sortie par os._exit). « timeout » met fin à un FreeCAD bloqué.
        # softpipe seulement pour le scénario qui prend une capture : avec llvmpipe la vue 3D
        # hors écran sort blanche, mais softpipe est dix fois plus lent.
        # Même dossier utilisateur que l'étape précédente, qui y a lié l'atelier (Mod/Menuiserie)
        # et coupé la zone de notifications.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export FREECAD_USER_HOME="$RUNNER_TEMP/freecad-home"
          export PILE_EN_CAS_DE_PLANTAGE="$RUNNER_TEMP/pile-qtest.txt"
          export RAPPORT_QTEST="$RUNNER_TEMP/rapport-qtest.txt"
          journal="$RUNNER_TEMP/freecad-qtest.log"
          piles="$RUNNER_TEMP/piles-qtest.txt"
          rm -f "$journal" "$piles"
          statut=0
          for fichier in tests/qtest/scenario_*.py; do
            module="tests.qtest.$(basename "$fichier" .py)"
            echo "=== $module" >> "$journal"
            rm -f "$RAPPORT_QTEST" "$PILE_EN_CAS_DE_PLANTAGE"
            if [ "$module" = tests.qtest.scenario_queue_aronde ]; then
              export GALLIUM_DRIVER=softpipe CAPTURES_QTEST="$RUNNER_TEMP/captures-qtest"
            else
              export GALLIUM_DRIVER=llvmpipe
              unset CAPTURES_QTEST
            fi
            SCENARIO="$module" timeout --kill-after=10 600 \
              xvfb-run -a -s "-screen 0 1600x1000x24" freecad tests/qtest/lanceur.py \
              >> "$journal" 2>&1 || { echo "ÉCHEC de $module (statut $?)" >> "$journal"; statut=1; }
            if [ -f "$RAPPORT_QTEST" ]; then cat "$RAPPORT_QTEST" >> "$journal"; fi
            if [ -s "$PILE_EN_CAS_DE_PLANTAGE" ]; then cat "$PILE_EN_CAS_DE_PLANTAGE" >> "$piles"; fi
          done
          # Journal affiché sans que ses lignes « ::… » soient prises pour des commandes du runner.
          jeton="$(openssl rand -hex 16)"
          echo "::stop-commands::$jeton"
          cat "$journal"
          if [ -s "$piles" ]; then echo "=== Piles Python au plantage"; cat "$piles"; fi
          echo "::$jeton::"
          if [ "$statut" -ne 0 ]; then
            echo "::error title=Scénarios QTest::échec, voir « ÉCHEC de » dans le journal ci-dessus"
            false
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures-qtest
          path: ${{ runner.temp }}/captures-qtest/*.png
          if-no-files-found: ignore
          retention-days: 14
