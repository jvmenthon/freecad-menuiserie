name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, typage et tests unitaires
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer l'outillage
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy freecad tests
      - name: Tests unitaires
        run: pytest tests/unit --cov --cov-report=term-missing

  integration:
    name: Intégration FreeCAD ${{ matrix.freecad }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        freecad: ["1.0", "1.1"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: freecad
          create-args: >-
            freecad=${{ matrix.freecad }}.*
            pytest
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
      - name: Version de FreeCAD
        run: |
          export PYTHONPATH="$CONDA_PREFIX/lib:$PYTHONPATH"
          python -c "import FreeCAD; print(FreeCAD.Version())"
      - name: Tests d'intégration
        run: |
          export PYTHONPATH="$CONDA_PREFIX/lib:$PYTHONPATH"
          pytest tests/integration -m integration
      - name: Chargement dans l'interface de FreeCAD
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "::notice title=Diag::début"
          export FREECAD_USER_HOME="$RUNNER_TEMP/freecad-home"
          mkdir -p "$FREECAD_USER_HOME/Mod"
          ln -s "$GITHUB_WORKSPACE" "$FREECAD_USER_HOME/Mod/Menuiserie"
          echo "::notice title=Diag::lien créé"
          export RESULTAT="$RUNNER_TEMP/resultat-gui.txt"
          journal="$RUNNER_TEMP/freecad-gui.log"
          statut=0
          timeout 300 freecad "$GITHUB_WORKSPACE/tests/gui/verifier_atelier.py" > "$journal" 2>&1 \
            || statut=$?
          echo "::notice title=Diag::freecad statut $statut journal $(wc -l < "$journal") lignes, rapport $(ls -la "$RESULTAT" 2>&1)"
          head -n 15 "$journal" | sed 's/^/::notice title=JournalDebut::/'
          tail -n 15 "$journal" | sed 's/^/::notice title=JournalFin::/'
          ls -la "$FREECAD_USER_HOME" "$FREECAD_USER_HOME/Mod/" | sed 's/^/::notice title=Home::/'
          if [ "$statut" -eq 0 ] && grep -q '^OK' "$RESULTAT" 2>/dev/null; then
            cat "$RESULTAT"
            exit 0
          fi
          # Rapport et fin du journal en annotations, lisibles depuis la PR.
          echo "::error title=Interface FreeCAD::échec (statut $statut)"
          [ -f "$RESULTAT" ] && sed 's/^/::error title=Rapport::/' "$RESULTAT"
          tail -n 25 "$journal" | sed 's/^/::warning title=Journal FreeCAD::/'
          exit 1
