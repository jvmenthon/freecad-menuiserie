# Ce fichier sert uniquement à configurer l'outillage de développement.
# L'atelier s'installe via l'Addon Manager de FreeCAD (voir package.xml).

[project]
name = "freecad-menuiserie"
version = "0.1.0"
description = "Atelier FreeCAD de menuiserie paramétrique"
license = "LGPL-2.1-or-later"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "mypy>=2.0",
    "pytest>=8",
    "pytest-cov>=5",
    "bandit>=1.7",
    "pylint>=3.3",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # tri des imports
    "N",        # nommage PEP 8
    "UP",       # syntaxe Python moderne
    "B",        # bugbear
    "S",        # sécurité (règles bandit)
    "SIM",      # simplifications
    "RUF",
    "C90",      # complexité cyclomatique
    "PLR0911",  # trop de return
    "PLR0912",  # trop de branches
    "PLR0913",  # trop d'arguments
    "PLR0915",  # trop d'instructions
]
# FreeCAD impose des noms de méthodes en CamelCase (Initialize, GetClassName, ...).
ignore = ["N802", "N815"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["freecad.menuiserie"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# FreeCAD, sa couche Qt et pivy (Coin) ne fournissent pas d'annotations de type.
module = ["FreeCAD", "FreeCADGui", "Part", "PySide", "PySide.*", "pivy", "pivy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["freecad.menuiserie.core", "freecad.menuiserie.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: nécessite FreeCAD (exécuté dans l'environnement FreeCAD de la CI)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["freecad/menuiserie"]
omit = ["freecad/menuiserie/init_gui.py", "freecad/menuiserie/gui/*"]

# Détection du code dupliqué (pylint ne sert qu'à cela : le reste est couvert par ruff).
[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.bandit]
exclude_dirs = ["tests"]
