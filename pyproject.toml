# Ce fichier sert uniquement à configurer l'outillage de développement.
# L'atelier s'installe via l'Addon Manager de FreeCAD (voir package.xml).

[project]
name = "freecad-menuiserie"
version = "0.1.0"
description = "Atelier FreeCAD de menuiserie paramétrique"
license = "LGPL-2.1-or-later"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "mypy>=2.0",
    "pytest>=8",
    "pytest-cov>=5",
    "bandit>=1.7",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # tri des imports
    "N",        # nommage PEP 8
    "UP",       # syntaxe Python moderne
    "B",        # bugbear
    "S",        # sécurité (règles bandit)
    "SIM",      # simplifications
    "RUF",
]
# FreeCAD impose des noms de méthodes en CamelCase (Initialize, GetClassName, ...).
ignore = ["N802", "N815"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["freecad.menuiserie"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# FreeCAD et sa couche Qt ne fournissent pas d'annotations de type.
module = ["FreeCAD", "FreeCADGui", "Part", "PySide", "PySide.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["freecad.menuiserie.core", "freecad.menuiserie.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite FreeCAD (exécuté dans l'environnement FreeCAD de la CI)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["freecad/menuiserie"]
omit = ["freecad/menuiserie/init_gui.py", "freecad/menuiserie/gui/*"]

[tool.bandit]
exclude_dirs = ["tests"]
