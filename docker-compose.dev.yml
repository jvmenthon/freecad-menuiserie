# Configuration Docker Compose pour le développement avec montage de volume
#
# Utilisation :
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml build
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml run test
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

# Override des services pour le développement
services:
  test:
    volumes:
      # Monter le code source en lecture-écriture pour développement
      - .:/workspace/freecad-menuiserie
      - ./tmp/freecad-home:/tmp/freecad-home
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_NO_CACHE_DIR=1

  shell:
    volumes:
      - .:/workspace/freecad-menuiserie
      - ./tmp/freecad-home:/tmp/freecad-home

  test-unit:
    extends: test

  test-integration:
    extends: test

  lint:
    extends: test

  type-check:
    extends: test
